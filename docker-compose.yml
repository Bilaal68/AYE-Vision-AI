services:
  db:
    build:
      context: ./infrastructure/postgres
      dockerfile: Dockerfile
    container_name: secint_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secint_db}
      POSTGRES_USER: ${POSTGRES_USER:-secint_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secint_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secint_admin} -d ${POSTGRES_DB:-secint_db}"]
      interval: 5s
      timeout: 5s
      retries: 8
    networks:
      - secint_net

  redis:
    image: redis:7-alpine
    container_name: secint_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8
    networks:
      - secint_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secint_backend
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secint_db}
      POSTGRES_USER: ${POSTGRES_USER:-secint_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secint_change_me}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-only-change-me}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - secint_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secint_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - secint_net

networks:
  secint_net:
    driver: bridge
    name: secint_net

volumes:
  postgres_data:
  frontend_node_modules:
